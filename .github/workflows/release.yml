name: Package and Release

# Packages and publishes on version tags. Secrets are optional until upload
# targets are configured; without them the zip and GitHub Release still work.
on:
  push:
    tags:
      - '[0-9]+-[0-9]+-[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: packager

    # Add these as repository secrets when ready (Settings → Secrets → Actions):
    #   CF_API_KEY      https://authors.curseforge.com/#/settings/api-tokens
    #   WOWI_API_TOKEN  https://www.wowinterface.com/downloads/filecpl.php?action=apitokens
    #   WAGO_API_TOKEN  https://addons.wago.io/account/apikeys
    # Then set matching X-Curse-Project-ID / X-WoWI-ID / X-Wago-ID in TyGear.toc
    # (do not reuse AutoGear's IDs). GITHUB_TOKEN is provided automatically.
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
